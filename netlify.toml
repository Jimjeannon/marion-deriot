# Configuration Netlify — Marion Dériot
# Fichier checké dans le repo, prend le pas sur les settings du dashboard.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Node 20 LTS — requis par @astrojs/netlify v5+
  NODE_VERSION = "20"
  # Évite le mode strict sur les peer deps qui bloquerait l'install
  NPM_FLAGS = "--legacy-peer-deps"

  # Scan de secrets Netlify : il cherche la VALEUR de chaque variable d'env
  # définie sur le site dans tout le dépôt et le build. Les variables ci-dessous
  # ne sont pas des secrets — l'ID projet Sanity circule dans chaque URL d'image,
  # le dataset s'appelle « production » (mot présent partout), et les adresses de
  # contact figurent volontairement dans les mentions légales. Les exclure évite
  # de faire échouer le déploiement sur des faux positifs.
  # SANITY_API_WRITE_TOKEN, lui, reste scanné : c'est le seul vrai secret.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_ACCESS_CODE,PUBLIC_SANITY_PROJECT_ID,PUBLIC_SANITY_DATASET,PUBLIC_SITE_URL,CONTACT_EMAIL_TO,CONTACT_EMAIL_FROM"

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Admin Sanity — pas d'indexation
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Cache long pour les assets immuables Astro
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
